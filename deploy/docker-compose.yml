services:
  telegram-userbot:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: telegram-userbot:local
    container_name: telegram-userbot
    restart: unless-stopped
    init: true
    environment:
      MCP_HTTP_PORT: "8790"
      MCP_HOST: "0.0.0.0"
      ENV_FILE: /config/.env
      TG_SESSION_FILE: /config/session.txt
      # Everything else - MCP_TOKEN, NOTIFY_CHAT, EXCLUDE, SEND_ALLOWLIST, ... -
      # is read from /config/.env. See .env.example.
    volumes:
      - ./config:/config:ro
    # Uncomment to reach the MCP endpoint from the host. Keep it bound to
    # loopback unless MCP_TOKEN is set.
    # ports:
    #   - "127.0.0.1:8790:8790"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8790/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 25s

# The container joins the network named by DOCKER_NETWORK (default: a compose
# network called "telegram-userbot"). Point it at an existing network so another
# container can reach http://telegram-userbot:8790/mcp:
#
#   DOCKER_NETWORK=my-stack_default docker compose -f deploy/docker-compose.yml up -d --build
networks:
  default:
    name: ${DOCKER_NETWORK:-telegram-userbot}
